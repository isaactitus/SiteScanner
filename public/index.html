<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SiteScanner — Enterprise Security Auditing</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div class="app-container">
    <nav class="app-nav">
      <a href="/" class="nav-brand">
        <span class="nav-brand-badge"></span>
        SiteScanner
      </a>
      <div style="display: flex; align-items: center; gap: 16px;">
        <div class="nav-status">
          <span class="nav-status-dot"></span> Engine Online
        </div>
        <div id="authNavContainer" style="position: relative;">
          <button id="navSignInBtn" class="cta-button" style="padding: 6px 20px; font-size: 0.85rem;" type="button">Sign In</button>
        </div>
      </div>
    </nav>

    <!-- Centered Minimalist Search Interface -->
    <main style="margin-top: 10vh;">
      <section class="omnibox-container">
        <div class="omnibox-tabs">
          <button id="tabFull" class="omni-tab active" type="button">Standard Audit</button>
          <button id="tabActive" class="omni-tab pro-tab" type="button">Active DAST (Pro)</button>
        </div>

        <form id="scanForm" class="omnibox-form">
          <div class="omnibox-wrapper">
            <span class="omnibox-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </span>
            <input 
              id="targetUrl" 
              type="text" 
              class="omnibox-input" 
              placeholder="Enter target domain (e.g., alelken.in)" 
              spellcheck="false" 
              autocomplete="off" 
              required 
            />
            <button id="submitScanBtn" type="submit" class="omnibox-btn">Analyze Target</button>
          </div>

          <div class="omnibox-options">
            <label class="checkbox-label" style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
              <input type="checkbox" id="ownershipConfirmed" checked required style="accent-color: var(--brand-cyan);" />
              <span>I confirm authorization to scan this domain</span>
            </label>
            <label class="checkbox-label" id="publicFeedOption" style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
              <input type="checkbox" id="listPublicly" checked style="accent-color: var(--brand-cyan);">
              <span>List result in public recent scans</span>
            </label>
          </div>
        </form>
      </section>

      <!-- Results Area -->
      <section id="results" class="results-area"></section>
    </main>
  </div>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="/render.js"></script>
  <script src="/app.js"></script>
</body>
</html>
