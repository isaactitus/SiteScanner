<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Free website security scanner. Check SSL, security headers, malware, cookies, CORS, and more — instantly, with a plain-English report and copy-paste fixes." />
<meta property="og:title" content="SiteScanner — Free Website Security Check" />
<meta property="og:description" content="Scan any website for SSL, header, malware, and privacy issues. Free, instant, no signup." />
<meta property="og:type" content="website" />
<title>SiteScanner — Free Security Health Check</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #131a22;
    --accent: #4ade80;
    --warn: #fbbf24;
    --bad: #f87171;
    --text: #e5e7eb;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  p.sub { color: var(--muted); margin-top: 0; font-size: 0.95rem; }
  .card {
    background: var(--panel);
    border-radius: 14px;
    padding: 18px;
    margin-top: 16px;
    border: 1px solid #1f2937;
  }
  input[type=text] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #334155;
    background: #0f151c;
    color: var(--text);
    font-size: 1rem;
  }
  label.confirm {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-top: 14px;
    font-size: 0.9rem;
    color: var(--muted);
  }
  button {
    width: 100%;
    margin-top: 16px;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #05130a;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .result-item {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #1f2937;
    font-size: 0.92rem;
  }
  .result-item:last-child { border-bottom: none; }
  .status { font-weight: 600; }
  .ok { color: var(--accent); }
  .warn { color: var(--warn); }
  .bad { color: var(--bad); }
  .loading { color: var(--muted); text-align: center; padding: 20px; }
  .report { white-space: pre-wrap; line-height: 1.5; font-size: 0.95rem; }

  /* Scan pulse animation */
  .scan-pulse-wrap { display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
  .scan-pulse { position: relative; width: 100px; height: 100px; display: flex; align-items: center; justify-content: center; }
  .pulse-ring {
    position: absolute; width: 100%; height: 100%; border-radius: 50%;
    border: 2px solid var(--accent); opacity: 0;
    animation: pulse-expand 2s ease-out infinite;
  }
  .pulse-ring.delay1 { animation-delay: 0.6s; }
  .pulse-ring.delay2 { animation-delay: 1.2s; }
  .pulse-core { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
  @keyframes pulse-expand {
    0% { transform: scale(0.3); opacity: 0.8; }
    100% { transform: scale(1); opacity: 0; }
  }
  .scan-pulse-label { margin-top: 16px; color: var(--muted); font-size: 0.9rem; }

  /* Hero grade ring */
  .hero-grade-wrap { display: flex; align-items: center; gap: 20px; padding: 24px; }
  .grade-ring { position: relative; width: 96px; height: 96px; flex-shrink: 0; }
  .grade-ring svg { transform: rotate(-90deg); width: 100%; height: 100%; }
  .grade-ring-bg { fill: none; stroke: #1f2937; stroke-width: 8; }
  .grade-ring-fg { fill: none; stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 0.8s ease; }
  .grade-ring-letter {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.8rem; font-weight: 700;
  }
  .hero-grade-info { flex: 1; }
  .hero-grade-score { font-size: 0.9rem; color: var(--muted); }
  .hero-grade-delta { font-size: 0.85rem; margin-top: 4px; }

  /* Summary line + staggered fade-in */
  .summary-line { text-align: center; font-size: 0.9rem; color: var(--muted); padding: 0 0 16px; }
  .summary-critical { color: var(--bad); font-weight: 600; }
  .summary-warning { color: var(--warn); font-weight: 600; }
  .summary-passed { color: var(--accent); font-weight: 600; }
  .fade-in { opacity: 0; animation: fadeInUp 0.4s ease forwards; }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔍 SiteScanner</h1>
  <p class="sub">Free passive security health check for your website. No exploits, no attacks — just checks.</p>

  <!-- Quick Check -->
  <div class="card">
    <strong style="display:block; margin-bottom:10px;">Quick Check — is this site safe?</strong>
    <input type="text" id="quickInput" placeholder="yourdomain.com" />
    <label class="confirm">
      <input type="checkbox" id="quickConfirm" />
      I own this domain or have explicit permission to check it.
    </label>
    <button id="quickBtn">Check Now</button>
    <div id="quickResult"></div>
  </div>

  <!-- Full Technical Scan -->
  <div class="card">
    <strong style="display:block; margin-bottom:10px;">Full Technical Scan</strong>
    <input type="text" id="urlInput" placeholder="yourdomain.com" />
    <label class="confirm">
      <input type="checkbox" id="confirmOwn" />
      I own this domain or have explicit permission to scan it.
    </label>
    <label class="confirm">
      <input type="checkbox" id="listPublicly" />
      List this scan on the public "Recently scanned" feed
    </label>
    <button id="scanBtn">Scan Now</button>
  </div>

  <div id="recentFeed"></div>
  <div id="results"></div>
</div>

<script src="/render.js"></script>
<script>
// Public "Recently scanned" feed
async function loadRecentFeed() {
  const feedEl = document.getElementById('recentFeed');
  try {
    const res = await fetch('/api/recent');
    const feed = await res.json();
    if (!feed.length) { feedEl.innerHTML = ''; return; }

    const gradeColor = g => ({ A: '#4ade80', B: '#4ade80', C: '#fbbf24', D: '#fbbf24', F: '#f87171' }[g] || 'var(--muted)');
    let html = `<div class="card"><strong>Recently Scanned (public, opt-in)</strong>`;
    feed.forEach(item => {
      html += `<div class="result-item"><span><a href="/report/${item.hostname}" style="color:var(--text);">${item.hostname}</a></span><span class="status" style="color:${gradeColor(item.grade)};">${item.grade} (${item.score})</span></div>`;
    });
    html += `</div>`;
    feedEl.innerHTML = html;
  } catch {
    feedEl.innerHTML = '';
  }
}
loadRecentFeed();

// Quick Check Logic
const quickBtn = document.getElementById('quickBtn');
const quickResultEl = document.getElementById('quickResult');

quickBtn.addEventListener('click', async () => {
  const url = document.getElementById('quickInput').value.trim();
  const confirmed = document.getElementById('quickConfirm').checked;

  if (!url) return alert('Enter a domain first.');
  if (!confirmed) return alert('Please confirm you have permission to check this domain.');

  quickBtn.disabled = true;
  quickResultEl.innerHTML = '<div class="loading">Checking…</div>';

  try {
    const res = await fetch('/api/quickcheck', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url, ownershipConfirmed: confirmed }),
    });
    const data = await res.json();

    if (data.error) {
      quickResultEl.innerHTML = `<div style="color:var(--bad); margin-top:12px;">${data.error}</div>`;
      quickBtn.disabled = false;
      return;
    }

    // Default to Safe
    let color = 'var(--accent)';
    let bg = 'rgba(74,222,128,0.1)';
    let label = '✅ Safe & Clean';

    // Apply exact wording requested
    if (data.status === 'critical') {
      color = 'var(--bad)';
      bg = 'rgba(248,113,113,0.1)';
      label = '🚨 Unsafe (High Risk)';
    } else if (data.status === 'warning') {
      color = 'var(--warn)';
      bg = 'rgba(251,191,36,0.1)';
      label = '⚠️ Safe to browse, but needs Developer attention';
    }

    let html = `<div style="margin-top:16px; padding:16px; border-radius:10px; background:${bg}; border:1px solid ${color};">`;
    html += `<div style="font-size:1.1rem; font-weight:700; color:${color};">${label}</div>`;
    
    if (data.reasons && data.reasons.length > 0) {
      html += `<ul style="margin:8px 0 0 18px; color:var(--muted); font-size:0.9rem;">`;
      data.reasons.forEach(r => html += `<li>${r}</li>`);
      html += `</ul>`;
    }
    
    html += `<a href="#" id="wantFullReport" style="display:inline-block; margin-top:12px; color:var(--accent); font-size:0.9rem;">Want the full technical report? →</a>`;
    html += `</div>`;
    quickResultEl.innerHTML = html;

    document.getElementById('wantFullReport').addEventListener('click', (e) => {
      e.preventDefault();
      document.getElementById('urlInput').value = url;
      document.getElementById('confirmOwn').checked = true;
      document.getElementById('urlInput').scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  } catch (err) {
    quickResultEl.innerHTML = `<div style="color:var(--bad); margin-top:12px;">Check failed: ${err.message}</div>`;
  }
  quickBtn.disabled = false;
});

// Full Scan Logic
const btn = document.getElementById('scanBtn');
const resultsEl = document.getElementById('results');

btn.addEventListener('click', () => {
  const url = document.getElementById('urlInput').value.trim();
  const confirmed = document.getElementById('confirmOwn').checked;
  const listPublicly = document.getElementById('listPublicly').checked;

  if (!url) return alert('Enter a domain first.');
  if (!confirmed) return alert('Please confirm you have permission to scan this domain.');

  btn.disabled = true;
  resultsEl.innerHTML = `
    <div class="card scan-pulse-wrap">
      <div class="scan-pulse">
        <div class="pulse-ring"></div>
        <div class="pulse-ring delay1"></div>
        <div class="pulse-ring delay2"></div>
        <div class="pulse-core"></div>
      </div>
      <div class="scan-pulse-label" id="scanStatusLabel">Starting scan…</div>
      <div id="scanStatusList" style="margin-top:14px; font-size:0.85rem; color:var(--muted); text-align:left;"></div>
    </div>`;

  const statusLabel = document.getElementById('scanStatusLabel');
  const statusList = document.getElementById('scanStatusList');
  const doneChecks = [];

  const params = new URLSearchParams({ url, confirmed: 'true', listPublicly: String(listPublicly) });
  const source = new EventSource('/api/scan-stream?' + params.toString());

  source.addEventListener('progress', (e) => {
    const { label, status } = JSON.parse(e.data);
    doneChecks.push({ label, status });
    statusLabel.textContent = `Scanning ${url}… (${doneChecks.length}/9)`;
    statusList.innerHTML = doneChecks
      .map(c => `<div>${c.status === 'done' ? '✓' : '⚠'} ${c.label}</div>`)
      .join('');
  });

  source.addEventListener('done', (e) => {
    const data = JSON.parse(e.data);
    source.close();
    renderResults(data);
    applyStaggeredFadeIn(resultsEl);
    resultsEl.insertAdjacentHTML('afterbegin', `<div class="card" style="text-align:center;">🔗 <a href="/report/${data.hostname}" target="_blank" style="color:var(--accent);">Shareable link to this report →</a></div>`);
    loadRecentFeed();
    btn.disabled = false;
  });

  source.addEventListener('error_msg', (e) => {
    const { error } = JSON.parse(e.data);
    source.close();
    resultsEl.innerHTML = `<div class="card bad" style="color:var(--bad);">${error}</div>`;
    btn.disabled = false;
  });

  source.addEventListener('error', () => {
    if (source.readyState === EventSource.CLOSED) return;
    source.close();
    resultsEl.innerHTML = `<div class="card bad" style="color:var(--bad);">Scan failed or address is restricted. Please check the domain and try again.</div>`;
    btn.disabled = false;
  });
});
</script>
</body>
</html>
