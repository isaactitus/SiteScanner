<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SiteScanner — Passive Security Architecture Audit</title>
  <link rel="stylesheet" href="/style.css" />
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div class="app-container">
    <nav class="app-nav">
      <a href="/" class="nav-brand">
        <span class="nav-brand-badge"></span>
        SiteScanner
      </a>
      <div style="display: flex; align-items: center; gap: 16px;">
        <div class="nav-status">
          <span class="nav-status-dot"></span> Engine Online
        </div>
        <div id="authNavContainer" style="position: relative;">
          <button id="navSignInBtn" class="cta-button" style="padding: 6px 14px; font-size: 0.85rem;" type="button">Sign In</button>
        </div>
      </div>
    </nav>

    <header class="hero">
      <h1 class="hero-title">Passive Security Auditing.</h1>
      <p class="hero-subtitle">Production-grade security health checks, real-time threat intelligence, and tailored remediation guidance.</p>
    </header>

    <main>
      <!-- Unified Scanning Dock -->
      <section class="scan-card">
        <div class="tab-group">
          <button id="tabQuick" class="tab-btn active" type="button">Quick Check</button>
          <button id="tabFull" class="tab-btn" type="button">Deep Technical Scan</button>
        </div>

        <form id="scanForm">
          <div class="input-group">
            <input 
              id="targetUrl" 
              type="text" 
              class="scan-input" 
              placeholder="example.com" 
              spellcheck="false" 
              autocomplete="off" 
              required 
            />
            <button id="submitScanBtn" type="submit" class="scan-btn">Scan Target</button>
          </div>

          <div class="scan-options">
            <label class="checkbox-label">
              <input type="checkbox" id="ownershipConfirmed" checked required />
              <span>I confirm authorization to scan this domain</span>
            </label>
            <label class="checkbox-label" id="publicFeedOption" style="display: none;">
              <input type="checkbox" id="listPublicly" checked />
              <span>List result in public recent scans</span>
            </label>
          </div>
        </form>
      </section>

      <!-- Recent Scans Live Ticker -->
      <div class="feed-card" id="feedCard">
        <span class="feed-title">Recent Audits:</span>
        <div class="feed-items" id="recentList">
          <span style="color: var(--text-tertiary); font-size: 0.8rem;">Loading persistent feed...</span>
        </div>
      </div>

      <!-- Quick Check Result Dropdown -->
      <div id="quickCheckResult" style="display: none; margin-bottom: 24px;"></div>

      <!-- Progressive / Standard Output Section -->
      <section id="results" class="results-area"></section>
    </main>
  </div>

  <!-- Razorpay Checkout Script -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="/render.js"></script>
  <script src="/app.js"></script>
</body>
</html>
